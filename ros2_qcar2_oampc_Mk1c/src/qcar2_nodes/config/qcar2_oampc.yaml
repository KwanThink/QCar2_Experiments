qcar2_oampc_controller:
  ros__parameters:
    # Frames and topics
    map_frame: map
    base_frame: base_link
    goal_topic: /goal_pose
    joint_state_topic: qcar2_joint
    command_topic: qcar2_motor_speed_cmd
    reference_path_topic: /qcar2_oampc/reference_path   # fixed preview: P0 -> ... -> PN
    active_path_topic: /qcar2_oampc/active_path         # active path after 2D Goal trigger: S0 -> ... -> PN

    # Result logging. Each completed goal run is saved as run_OAMPC_Mk1c_x.
    enable_result_logging: true
    result_directory: /home/nvidia/Results/oampc_Mk1c

    # Runtime timing and safety
    control_period: 0.03
    transform_timeout: 0.10
    feedback_timeout: 0.25
    goal_position_tolerance: 0.2 #0.10
    stop_on_solver_failure: true

    # Flatness-based model and input mapping
    wheelbase: 0.25725 #m
    epsilon: 0.001
    Ts: 0.03 #s

    # OAMPC horizon and physical constraints
    mpc_N: 40
    vx_min: -2.0
    vx_max: 2.0
    delta_min: -0.5236
    delta_max: 0.5236
    ax_min: -1.0
    ax_max: 1.0

    # OAMPC Cartesian-position and virtual-input weights
    Q: [40.0, 40.0]
    R: [60.0, 60.0]

    # OAMPC obstacle avoidance
    obstacle_map_file: /home/nvidia/Maps/obstacle_map_oampc_Mk1c.yaml
    big_M: 100.0
    gamma: 0.35
    slack_weight: 100000000.0
    gurobi_output_flag: false
    gurobi_time_limit: 0.1 #s
    activation_radius: 2.0
    activation_field_of_view: 180.0
    max_active_obstacles: 4

    # Fixed-reference trajectory generation
    # 2D Goal in RViz2 is only a trigger. Its x/y/yaw are not used as the final goal.
    # Active trajectory after trigger:
    #   S0(TF map -> base_link) -> auto Hermite waypoints -> P0 -> P1 -> ... -> PN

    # Start trajectory S0 -> P0. If number_of_waypoints_start = 4:
    #   start geometry = [S0, A1, A2, P0]
    number_of_waypoints_start: 4
    segment_times_start: [2.0, 2.0, 2.0]

    # Fixed reference trajectory P0 -> P1 -> ... -> PN on the map.
    # Flat list format: [x0, y0, x1, y1, ...]
    waypoints_ref_xy: [
       0.00, 0.00,
      -0.90, 0.90,
      -1.80, 1.80,
      -2.70, 2.70
    ]

    segment_times_ref: [2.0, 2.0, 2.0]

    # Heading boundary conditions for the fixed reference.
    # psi(S0) comes from TF; psi(P0)=theta_start; psi(PN)=theta_end.
    theta_start: 2.356
    theta_end: 2.356

    minimum_segment_time: 1.0
    intermediate_tangent_scale: 1.0
    minimum_goal_distance: 0.15
    zero_endpoint_steering: false
